<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANANTA HOMES | Inspired by Excellence</title>
  
  <!-- Google Fonts: Cormorant Garamond (luxury serif) & Montserrat (modern sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Fullscreen Hero Container -->
  <main class="hero">
    <div class="overlay"></div>

    <!-- Header Navigation -->
    <header class="navbar">
      <div class="brand">
        <span class="logo-title">ANANTA</span>
        <span class="logo-subtitle">HOMES</span>
      </div>
      <nav class="nav-links">
        <a href="#home" class="active">HOME</a>
      </nav>
    </header>

    <!-- Center Hero Content -->
    <section class="hero-content">
      <div class="center-brand">
        <h1 class="logo-title-lg">ANANTA</h1>
        <div class="logo-divider">
          <span></span>
          <p>HOMES</p>
          <span></span>
        </div>
      </div>

      <p class="tagline">Inspired by Excellence.</p>

     <a href="#" class="btn-cta" id="open-contact">
  <span>CONTACT US</span>
  <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <line x1="5" y1="12" x2="19" y2="12"></line>
    <polyline points="12 5 19 12 12 19"></polyline>
  </svg>
</a>
    </section>

    <!-- Footer Bar -->
    <footer class="footer-bar">
      <div class="scroll-indicator">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <a href="https://wa.me/" class="whatsapp-btn" aria-label="Contact via WhatsApp">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
      </a>
    </footer>
  </main>
<!-- Contact Card Modal -->
  <div id="contact-modal" class="modal-overlay">
    <div class="contact-card">
      <button class="close-btn" id="close-contact">&times;</button>
      
      <h2 class="card-title">Get in Touch</h2>
      <div class="card-divider"></div>
      
      <div class="contact-info">
        <div class="info-item">
          <span class="info-label">PHONE</span>
          <a href="tel:+971585530789" class="info-value">+971 058 553 0789</a>
        </div>
        
        <div class="info-item">
          <span class="info-label">ADDRESS</span>
          <p class="info-value">Al Manara Tower, 1507<br>Business Bay, Dubai</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Javascript for Modal Toggle -->
  <script>
    const modal = document.getElementById('contact-modal');
    const openBtn = document.getElementById('open-contact');
    const closeBtn = document.getElementById('close-contact');

    openBtn.addEventListener('click', (e) => {
      e.preventDefault();
      modal.classList.add('show');
    });

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('show');
    });

    // Close when clicking outside the card
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('show');
      }
    });
  </script>
</body>
</html>
